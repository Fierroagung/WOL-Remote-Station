name: Build iOS IPA Installer (Sideloadly Ready)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA Installer
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Generate Native iOS Project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build Unsigned Xcode Archive
        run: |
          WORKSPACE=$(basename ios/*.xcworkspace .xcworkspace)
          echo "Building workspace: $WORKSPACE"
          xcodebuild -workspace "ios/${WORKSPACE}.xcworkspace" \
            -scheme "${WORKSPACE}" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "build/${WORKSPACE}.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package to IPA
        run: |
          rm -rf Payload WOLRemoteStation.ipa
          mkdir -p Payload
          cp -R build/*.xcarchive/Products/Applications/*.app Payload/
          zip -r -y WOLRemoteStation.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WOLRemoteStation-iOS-IPA
          path: WOLRemoteStation.ipa
